# Install after issuing the ecrannews.ir certificate with Certbot's nginx plugin.
# Both HTTP names are ready; www still needs its DNS record and a certificate
# covering www before adding it to the HTTPS server_name below.
server {
    listen 80;
    listen [::]:80;
    server_name ecrannews.ir www.ecrannews.ir;
    return 301 https://cinemanamayesh.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ecrannews.ir;

    ssl_certificate /etc/letsencrypt/live/ecrannews.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecrannews.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cinemanamayesh.ir$request_uri;
}
